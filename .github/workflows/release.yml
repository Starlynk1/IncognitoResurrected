# BigWigs packager: zip + GitHub release + CurseForge upload on version tags.
name: Package and release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Packager accepts either name. Both read the same repo secret.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # Tag as v2.1.0. Zip, CurseForge label, and GitHub title become
          # IncognitoResurrected-v2.1.0
          args: >-
            -p 961634
            -n "{package-name}-{project-version}:{package-name}-{project-version}"

      - name: Set GitHub release title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == IncognitoResurrected-* ]]; then
            title="$tag"
          else
            title="IncognitoResurrected-${tag}"
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title"
